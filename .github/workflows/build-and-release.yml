name: Build and Release Google Emoji 3D TTF

on:
  schedule:
    # Autonomous sync & rebuild when new 3D PNG assets are published by Google (every 4 hours)
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      resolution:
        description: 'Bitmap strike resolution (px)'
        required: false
        type: choice
        options:
          - '128'
          - '160'
          - '72'
          - '32'
        default: '128'
      concurrency:
        description: 'Parallel download concurrency'
        required: false
        type: number
        default: 50
      tag_name:
        description: 'Release tag to update / overwrite'
        required: false
        type: string
        default: 'v1.0.0'
      create_release:
        description: 'Publish / Overwrite as GitHub Release'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - 'output/png/**'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/**'
    tags:
      - 'v*'
  repository_dispatch:
    types: [new-pngs, sync-emojis, release]

jobs:
  build-and-release:
    name: Build 3D Emoji TTF Font
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache downloaded 3D PNG assets
        uses: actions/cache@v4
        id: png-cache
        with:
          path: output/png
          key: noto-3d-pngs-${{ inputs.resolution || '128' }}px-${{ github.run_id }}
          restore-keys: |
            noto-3d-pngs-${{ inputs.resolution || '128' }}px-
            noto-3d-pngs-

      - name: Fetch and Categorize Metadata
        run: |
          python scripts/fetch_metadata.py

      - name: Parallel Download 3D PNG Assets
        run: |
          python scripts/download_assets.py \
            --resolution ${{ inputs.resolution || '128' }} \
            --concurrency ${{ inputs.concurrency || '50' }}

      - name: Compile Google Emoji 3D TTF Font
        run: |
          python scripts/build_font.py

      - name: Verify Font Integrity
        run: |
          python scripts/verify_font.py build/GoogleEmoji3D.ttf

      - name: Package Release Assets
        shell: pwsh
        run: |
          $res = "${{ inputs.resolution || '128' }}"
          $archiveName = "GoogleEmoji3D-${res}px.zip"
          
          Compress-Archive -Path "build/GoogleEmoji3D.ttf", "data/categories_manifest.json", "data/emojis_metadata.json", "README.md" -DestinationPath "build/$archiveName" -Force
          Write-Host "Created release archive: build/$archiveName"
          
          $sizeMb = (Get-Item "build/GoogleEmoji3D.ttf").Length / 1MB
          "FONT_SIZE_MB=$([math]::Round($sizeMb, 2))" >> $env:GITHUB_ENV
          "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoogleEmoji3D-${{ inputs.resolution || '128' }}px
          path: |
            build/GoogleEmoji3D.ttf
            build/*.zip
            data/categories_manifest.json

      - name: Create or Overwrite GitHub Release
        if: ${{ inputs.create_release != false || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || 'v1.0.0' }}
          name: Google Emoji 3D (v1.0.0 - Latest Rolling Release)
          body: |
            ## 🎨 Google Emoji 3D (Android 17 Volumetric Style)

            TrueType (`.ttf`) color emoji font compiled autonomously from Google's official 3D Noto Emoji assets.
            This single rolling release is continuously updated, overwriting the font asset with newly patched 3D emojis.

            ### 📦 Release Details
            - **Font File:** `GoogleEmoji3D.ttf` (${{ env.FONT_SIZE_MB }} MB)
            - **Bitmap Resolution:** ${{ inputs.resolution || '128' }}x${{ inputs.resolution || '128' }} px
            - **Format:** OpenType / TrueType with `sbix` color bitmap strikes, `cmap` Format 12, and `GSUB` sequence ligatures.
            - **Compatible with:** Gboard (via Custom Emoji Font feature in [mrdarksidetm/Gboard-patches](https://github.com/mrdarksidetm/Gboard-patches)), Android system font mods, Windows 10/11, macOS, and Linux.

            ### 📁 Included Assets
            - `GoogleEmoji3D.ttf`: Standalone emoji font file ready to load in Gboard or install on system.
            - `categories_manifest.json`: Full categorized taxonomy matching Google Fonts Emoji.
            - `emojis_metadata.json`: Comprehensive Unicode proposal and CLDR metadata.

            ### 🚀 Installation in Gboard
            1. Download `GoogleEmoji3D.ttf` to your phone.
            2. Open **Gboard Settings** > **Gboard Patches** > **Custom Emoji Font (.ttf)**.
            3. Tap **Select .ttf Font File** and choose `GoogleEmoji3D.ttf`.
            4. Enjoy full 3D emojis right in your Gboard keyboard!
          files: |
            build/GoogleEmoji3D.ttf
            build/${{ env.ARCHIVE_NAME }}
            data/categories_manifest.json
          make_latest: true
          overwrite: true
